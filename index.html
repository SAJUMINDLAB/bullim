<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>불림</title>
<meta name="apple-mobile-web-app-title" content="불림">
<meta name="application-name" content="불림">
<meta name="theme-color" content="#3B4256">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #3B4256; --ink: #1F2430; --muted: #8A90A2; --line: #E6E8EE; --soft: #F4F5F8; --page: #EEF0F4;
    --blue: #2a78d6; --orange: #eb6834; --green: #1baf7a; --red: #e34948; --gray: #B8BDC9; --mint: #6EE7C5;
    --yellow: #FFF2CC; --card: #FFFFFF; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink);
    font-family: "Nanum Gothic", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  .top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.3px; white-space: nowrap; }
  .brand { display: flex; align-items: center; }
  .brand .logo { width: 24px; height: 24px; margin-right: 7px; }
  .brand small { color: var(--mint); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .month { margin-left: auto; display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.1);
    border-radius: 999px; padding: 2px; }
  .month button { background: none; border: 0; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; }
  .month button:hover { background: rgba(255,255,255,.15); }
  .month span { font-weight: 700; font-size: 14px; min-width: 92px; text-align: center; }
  .icon-btn { background: none; border: 0; color: #fff; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
  .icon-btn:hover { background: rgba(255,255,255,.15); }

  /* nav */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { background: none; border: 0; padding: 8px 0 7px; color: var(--muted); font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button.on { color: var(--navy); }
  .tabs button.add-btn span.dot { width: 40px; height: 40px; margin-top: -14px; border-radius: 50%; background: var(--blue); color: #fff;
    display: grid; place-items: center; box-shadow: 0 4px 12px rgba(42,120,214,.35); }
  .tabs button.add-btn.on span.dot { background: var(--navy); }

  main { max-width: 1240px; margin: 0 auto; padding: 14px 14px calc(86px + env(safe-area-inset-bottom)); }
  .view { display: none; }
  .view.on { display: block; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }

  /* cards */
  .card { background: var(--card); border-radius: var(--radius); padding: 16px 16px 14px; box-shadow: 0 1px 2px rgba(31,36,48,.05); min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--blue); }
  .card h2 .sub { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; }
  .hero { background: linear-gradient(135deg, #3B4256, #2E3446); color: #fff; }
  .hero .label { color: #C9CEDA; font-size: 13px; }
  .hero .big { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 6px 0 10px; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #C9CEDA; }
  .hero .meta b { color: #fff; }
  .delta-up { color: #FF8A8A; font-weight: 700; }
  .delta-down { color: #8CB8F5; font-weight: 700; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--soft); border-radius: 10px; padding: 10px 12px; border-top: 3px solid var(--gray); min-width: 0; }
  .tile .t { color: var(--muted); font-size: 11.5px; display: flex; justify-content: space-between; gap: 6px; }
  .tile .v { font-size: 18px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--red); } .down { color: var(--blue); }
  .muted { color: var(--muted); }

  .meter { height: 10px; border-radius: 6px; background: #ECEEF2; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 6px; background: var(--blue); }
  .meter.over > i { background: var(--red); }
  .row { display: grid; grid-template-columns: minmax(70px, 1.1fr) 1.6fr auto; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .row .amt { text-align: right; white-space: nowrap; font-weight: 700; }
  .row .amt small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .list-line { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list-line:last-child { border-bottom: 0; }
  .list-line .grow { flex: 1; min-width: 0; }
  .list-line .grow .s { color: var(--muted); font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 999px; background: var(--soft); color: var(--navy); white-space: nowrap; }
  .badge.hot { background: #FDEEF1; color: var(--red); }
  /* 고정 수입·지출·카드 결제 일정 */
  .c-card .tiles { margin-bottom: 6px; }
  .c-card .tile .left { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .fx-net { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 2px 2px 6px; border-bottom: 1px solid var(--line); }
  .fx-net b { color: var(--navy); }
  .sched .list-line .d { flex: 0 0 38px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .sched .list-line.done { opacity: .5; }
  .sched .list-line b.num { white-space: nowrap; }
  .split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 10px; gap: 2px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  svg.chart { width: 100%; height: auto; display: block; }

  /* list view */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .day { font-size: 12px; font-weight: 800; color: var(--muted); margin: 14px 0 2px; }
  .tx .amt { font-weight: 800; white-space: nowrap; }
  .t-수입 { color: var(--green); } .t-지출 { color: var(--red); } .t-저축\/투자 { color: var(--blue); } .t-이체 { color: var(--muted); }
  .del { border: 0; background: none; color: #C4C8D2; font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .del:hover { background: var(--soft); color: var(--red); }
  .del.arm { color: #fff; background: var(--red); }
  .edit { border: 0; background: none; color: #9AA0B0; font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .edit:hover { background: var(--soft); color: var(--blue); }
  .tx .btns { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .form-actions .save { flex: 1; margin-top: 0; }
  .form-actions .cancel { flex: 0 0 96px; border: 1px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; color: var(--muted); }

  /* add form */
  .form { max-width: 560px; margin: 0 auto; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  .input { width: 100%; border: 1px solid var(--line); background: var(--yellow); border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit; color: var(--ink); }
  .input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .amount-wrap { display: flex; gap: 8px; }
  .amount-wrap .input { font-size: 22px; font-weight: 800; text-align: right; }
  .seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px 6px; border-radius: 8px; font-weight: 800; font-size: 14px; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .cur { flex: 0 0 auto; width: 104px; }
  .catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .catgrid button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 11px 6px; font-weight: 700; font-size: 13px; color: var(--ink); }
  .catgrid button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .save { width: 100%; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 800; padding: 15px; margin-top: 4px; }
  .save:disabled { background: var(--gray); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--page); z-index: 40; color: var(--muted); font-weight: 700; }
  #loading.hide { display: none; }
  #signin { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 24px;
    background: linear-gradient(160deg, #3B4256, #2B3042); color: #fff; text-align: center; }
  #signin.show { display: grid; }
  .si-box { width: 100%; max-width: 360px; }
  .si-box img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .si-box h1 { margin: 14px 0 2px; font-size: 30px; }
  .si-sub { color: #C9CEDA; margin: 0 0 26px; font-size: 14px; }
  .si-box .save { background: #F5C542; color: #1F2430; }
  .si-msg { color: #FFB4B4; font-size: 13px; min-height: 18px; margin: 12px 0 0; }
  .si-link { background: none; border: 0; color: #C9CEDA; text-decoration: underline; font-size: 13px; margin-top: 6px; }
  .si-note { color: #8A90A2; font-size: 12px; margin-top: 18px; }

  /* who (가계 카드 안) */
  .who { margin-top: 12px; }
  .who-lab { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; align-items: center; }
  .who-lab i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .who .split { margin-top: 8px; height: 10px; }

  /* hero side stats */
  .hero-side { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .hero-side > div { background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .hero-side .t { font-size: 11px; color: #C9CEDA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-side .v { font-size: 14px; font-weight: 800; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-side .v small { font-size: 11px; font-weight: 700; margin-left: 4px; }

  /* calendar */
  .cal-wrap { display: grid; gap: 14px; grid-template-columns: 1fr; }
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-head div { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0 6px; }
  .cal-head div:first-child { color: var(--red); } .cal-head div:last-child { color: var(--blue); }
  .cal-grid { gap: 3px; }
  .cal-cell { background: var(--soft); border: 0; border-radius: 8px; min-height: 60px; padding: 5px 4px; text-align: left;
    display: flex; flex-direction: column; gap: 1px; color: var(--ink); min-width: 0; overflow: hidden; }
  .cal-cell .d { font-size: 12px; font-weight: 800; margin-bottom: 2px; }
  .cal-cell .i, .cal-cell .e, .cal-cell .s { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-cell .i { color: var(--green); } .cal-cell .e { color: var(--red); } .cal-cell .s { color: var(--blue); }
  .cal-cell.out { visibility: hidden; }
  .cal-cell.sun .d { color: var(--red); } .cal-cell.sat .d { color: var(--blue); }
  .cal-cell.today { background: #EAF8F2; }
  .cal-cell.sel { box-shadow: inset 0 0 0 2px var(--navy); background: #fff; }
  .cal-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
  /* 폰: 달력 아래 수입·지출·남은 돈 (1,000만원 넘어도 안 잘리게) */
  @media (max-width: 759px) {
    .cal-sum { gap: 6px; }
    .cal-sum .tile { padding: 8px 7px; }
    .cal-sum .tile .v { font-size: clamp(12px, 3.9vw, 18px); text-overflow: clip; letter-spacing: -0.3px; }
  }
  /* 월별 추이 (달력 탭 아래, PC에선 두 칸 다 차지) */
  .tr-card { grid-column: 1 / -1; }
  .tr-legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .tr-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; }
  .tr-up { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 12.5px; }
  .tr-up b { margin-right: 4px; }
  .c-acc .hint { margin-top: 8px; }
  .go-add { width: 100%; border: 1px dashed var(--gray); background: #fff; color: var(--navy); font-weight: 800; border-radius: 10px; padding: 11px; margin-top: 10px; }

  @media (max-width: 440px) {
    .brand small { display: none; }
    .month span { min-width: 84px; font-size: 13px; }
    .hero .big { font-size: 30px; }
  }
  /* 아주 좁은 화면 (구글 사이트 안에 넣었을 때 등): 숫자가 잘리지 않게 */
  @media (max-width: 380px) {
    main { padding-left: 8px; padding-right: 8px; }
    .top { padding-left: 10px; padding-right: 8px; gap: 6px; }
    .brand { font-size: 15px; }
    .month span { min-width: 74px; font-size: 12px; }
    .month button { width: 26px; height: 26px; }
    .card { padding: 12px 11px 10px; }
    .hero .big { font-size: clamp(22px, 8.2vw, 30px); }
    .hero .meta { font-size: 11.5px; gap: 2px 10px; }
    .hero-side { gap: 5px; }
    .hero-side > div { padding: 6px 6px; }
    .hero-side .t { font-size: 10px; }
    .hero-side .v { font-size: clamp(11px, 3.9vw, 14px); }
    .tiles { gap: 6px; }
    .tile { padding: 8px 8px; }
    .tile .t { font-size: 10.5px; }
    .tile .v { font-size: clamp(13px, 4.6vw, 18px); }
    .row { grid-template-columns: minmax(58px, 1fr) 1.2fr auto; gap: 6px; font-size: 12px; }
    .list-line { font-size: 12px; gap: 6px; }
    .card h2 .sub { font-size: 10px; }
  }
  /* desktop */
  @media (min-width: 760px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .wide { grid-column: 1 / -1; }
    .tiles.four { grid-template-columns: repeat(4, 1fr); }
    /* 홈: 카드 높이가 달라도 빈칸 없이 위로 채우기 */
    #homeGrid { display: block; column-count: 2; column-gap: 14px; }
    #homeGrid > .card { break-inside: avoid; margin-bottom: 14px; }
    #homeGrid > .hero { column-span: all; }
  }
  @media (min-width: 1000px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .span2 { grid-column: span 2; }
    .tabs { position: sticky; top: 54px; bottom: auto; display: flex; justify-content: center; gap: 4px; padding: 6px; border-top: 0; border-bottom: 1px solid var(--line); }
    .tabs button { flex-direction: row; font-size: 14px; padding: 8px 16px; border-radius: 8px; gap: 6px; }
    .tabs button svg { width: 18px; height: 18px; }
    .tabs button.on { background: var(--soft); }
    .tabs button.add-btn span.dot { width: 22px; height: 22px; margin: 0; box-shadow: none; }
    main { padding-bottom: 30px; }
    #toast { bottom: 30px; }
    .hero .big { font-size: 42px; }
  }
  /* PC: 크게, 시원하게 */
  @media (min-width: 1000px) {
    main { max-width: 1880px; padding: 24px 28px 40px; }
    .grid { gap: 20px; }
    /* 홈 = 한 화면 대시보드 (3칸) */
    #homeGrid { display: grid; column-count: auto; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-areas: "hero hero hero" "month month card" "budget budget div" "trend goal goal"; }
    #homeGrid > .card { margin: 0; }
    #homeGrid > .hero { grid-area: hero; } .c-month { grid-area: month; } .c-budget { grid-area: budget; }
    .c-card { grid-area: card; } .c-div { grid-area: div; } .c-trend { grid-area: trend; } .c-goal { grid-area: goal; }
    .c-month .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    /* PC: 일정 목록이 길어도 카드가 세로로 늘어나지 않게 안에서 스크롤 */
    .c-card .sched { max-height: 140px; overflow-y: auto; padding-right: 4px; }
    #homeGrid .sched .list-line { padding: 5px 0; gap: 6px; font-size: 12.5px; }
    .sched .list-line .grow .s { display: none; }
    .sched .list-line .grow b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sched .list-line .d { flex-basis: 34px; font-size: 11.5px; }
    .sched .badge { font-size: 10.5px; padding: 2px 6px; }
    #homeGrid .c-card .tile { padding: 7px 12px; }
    #homeGrid .c-card .tile .v { font-size: 16px; }
    .c-budget .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
    .c-budget .rows .row:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
    #homeGrid .card { padding: 16px 20px 14px; }
    #homeGrid .card h2 { margin-bottom: 10px; }
    #homeGrid .row { padding: 6px 0; font-size: 13.5px; }
    #homeGrid .list-line { padding: 8px 0; font-size: 13.5px; }
    #homeGrid .tile { padding: 10px 14px; }
    #homeGrid .tile .v { font-size: 18px; margin-top: 3px; }
    .card { padding: 22px 24px 20px; border-radius: 16px; }
    .card h2 { font-size: 15.5px; margin-bottom: 14px; }
    .card h2 .sub { font-size: 12.5px; }
    .hero { display: flex; align-items: center; gap: 28px; }
    #homeGrid .hero { padding: 20px 28px; }
    .hero .main { flex: 1; min-width: 0; }
    .hero .label { font-size: 14px; }
    .hero .big { font-size: 44px; margin: 4px 0 8px; }
    .hero .meta { font-size: 14px; gap: 6px 20px; }
    .hero-side { flex: 0 0 56%; margin-top: 0; gap: 12px; }
    .hero-side > div { padding: 12px 16px; border-radius: 12px; }
    .hero-side .t { font-size: 13px; }
    .hero-side .v { font-size: 19px; margin-top: 4px; }
    .tiles { gap: 10px; }
    .tile { padding: 12px 14px; border-radius: 12px; }
    .tile .t { font-size: 12.5px; }
    .tile .v { font-size: 22px; margin-top: 4px; }
    .row { font-size: 14px; padding: 8px 0; gap: 14px; }
    .row .amt small { font-size: 11.5px; }
    .list-line { font-size: 14px; padding: 10px 0; }
    .list-line .grow .s { font-size: 12.5px; }
    .badge { font-size: 12px; padding: 4px 9px; }
    .cal-wrap { grid-template-columns: minmax(0, 2.2fr) minmax(320px, 1fr); align-items: start; }

      tile("남은 예상", won(dv.remaining), "var(--gray)") + tile("원금 대비", pct(dv.yield, 2).replace("+", ""), "var(--navy)") + "</div></div>";
    h += '<div class="card wide"><h2>월별 배당 · 예상 vs 실제</h2>' + barChart(dv.byMonthExpected, dv.byMonthActual, +D.today.slice(5, 7)) + "</div>";
    $("investGrid").innerHTML = h;
  }

  // ---------- calendar ----------
  var selDay = null;
  function sumAmt(n) { return isPC() ? won(n) : man(n) + "원"; }
  function calAmt(n) { return isPC() ? num(n) : n >= 1e4 ? (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "만" : num(n); }
  function txLine(x) {
    var usd = x.usd !== "" && x.usd ? ' <span class="muted">($' + Number(x.usd).toFixed(2) + ")</span>" : "";
    return '<div class="list-line tx"><div class="grow"><b>' + esc(x.desc || x.item || x.cat) + '</b><div class="s">' + esc([x.cat, x.item].filter(Boolean).join(" · ")) + " · " + esc(x.who) + " · " + esc(x.pay) + (x.memo ? " · " + esc(x.memo) : "") + "</div></div>" +
      '<span class="amt num t-' + esc(x.type) + '">' + (x.type === "지출" ? "−" : x.type === "수입" ? "+" : "") + num(x.amt) + usd + "</span>" +
      '<span class="btns"><button class="edit" data-row="' + x.row + '">수정</button>' +
      '<button class="del" data-row="' + x.row + '" data-date="' + esc(x.date) + '" data-desc="' + esc(x.desc) + '">삭제</button></span></div>';
  }
  function renderCal() {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7), first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    if (!selDay || selDay.slice(0, 7) !== ym) selDay = D.today.slice(0, 7) === ym ? D.today : ym + "-01";
    var by = {};
    D.ledger.forEach(function (x) {
      if (x.date.slice(0, 7) !== ym) return;
      var o = by[x.date] || (by[x.date] = { i: 0, e: 0, s: 0 });
      if (x.type === "수입") o.i += x.amt; else if (x.type === "지출") o.e += x.amt; else if (x.type === "저축/투자") o.s += x.amt;
    });
    var cells = "";
    for (var k = 0; k < first; k++) cells += '<div class="cal-cell out"></div>';
    for (var d = 1; d <= days; d++) {
      var ds = ym + "-" + String(d).padStart(2, "0"), dow = (first + d - 1) % 7, o = by[ds];
      var c = "cal-cell" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "") + (ds === D.today ? " today" : "") + (ds === selDay ? " sel" : "");
      cells += '<button class="' + c + '" data-day="' + ds + '"><span class="d">' + d + "</span>" +
        (o && o.i ? '<span class="i num">+' + calAmt(o.i) + "</span>" : "") +
        (o && o.e ? '<span class="e num">−' + calAmt(o.e) + "</span>" : "") +
        (o && o.s ? '<span class="s num">' + calAmt(o.s) + "</span>" : "") + "</button>";
    }
    var inc = monthSum("수입", ym), exp = monthSum("지출", ym), sav = monthSum("저축/투자", ym);
    var left = '<div class="card"><h2>' + esc(ymLabel(ym)) + ' 달력<span class="sub"><b style="color:var(--green)">수입</b> · <b style="color:var(--red)">지출</b> · <b style="color:var(--blue)">저축/투자</b></span></h2>' +
      '<div class="cal-head">' + "일월화수목금토".split("").map(function (w) { return "<div>" + w + "</div>"; }).join("") + "</div>" +
      '<div class="cal-grid">' + cells + "</div>" +
      '<div class="cal-sum">' + tile("수입", sumAmt(inc), "var(--green)") + tile("지출", sumAmt(exp), "var(--red)") + tile("남은 돈", sumAmt(inc - exp - sav), "var(--navy)") + "</div></div>";
    var rows = D.ledger.filter(function (x) { return x.date === selDay; }).sort(function (p, q) { return q.row - p.row; });
    var sd = new Date(selDay + "T00:00:00");
    var right = '<div class="card"><h2>' + (+selDay.slice(5, 7)) + "월 " + (+selDay.slice(8)) + "일 (" + "일월화수목금토"[sd.getDay()] + ')<span class="sub">' + rows.length + "건</span></h2>" +
      (rows.length ? rows.map(txLine).join("") : '<div class="empty">이 날은 내역이 없어요.</div>') +
      '<button class="go-add" data-go-add="' + selDay + '">＋ 이 날짜로 입력하기</button></div>';
    $("calWrap").innerHTML = left + right + trendCard();
    fitCalSum();
  }
  // 월별 추이: 고른 달까지 최근 12개월 수입·지출·저축 막대 + 지난달보다 많이 늘어난 지출 분류
  function trendCard() {
    var ms = [];
    for (var k = 11; k >= 0; k--) {
      var m = shiftYm(ym, -k);
      ms.push({ ym: m, i: monthSum("수입", m), e: monthSum("지출", m), s: monthSum("저축/투자", m) });
    }
    var W = Math.max(320, Math.min(1180, (document.querySelector("main") || document.body).clientWidth - 70));
    var H = W > 600 ? 230 : 170, L = 40, R = 6, T = 10, B = 24;
    var mx = Math.max.apply(null, ms.map(function (x) { return Math.max(x.i, x.e, x.s); }).concat([1]));
    var bw = (W - L - R) / 12, ph = H - T - B, s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '">';
    for (var g = 0; g <= 2; g++) {
      var gv = mx * g / 2, gy = T + ph * (1 - g / 2);
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="#E6E8EE"/><text x="' + (L - 5) + '" y="' + (gy + 3) + '" text-anchor="end" font-size="9" fill="#8A90A2">' + man(gv) + "</text>";
    }
    ms.forEach(function (x, i) {
      var x0 = L + bw * i, w = bw * 0.24, cur = x.ym === ym;
      if (cur) s += '<rect x="' + (x0 + 1) + '" y="' + T + '" width="' + (bw - 2) + '" height="' + ph + '" fill="#F4F5F8" rx="4"/>';
      [[x.i, "#1baf7a", 0.12], [x.e, "#e34948", 0.38], [x.s, "#2a78d6", 0.64]].forEach(function (b) {
        var hh = ph * b[0] / mx;
        s += '<rect x="' + (x0 + bw * b[2]) + '" y="' + (T + ph - hh) + '" width="' + w + '" height="' + hh + '" fill="' + b[1] + '" rx="2"><title>' + ymLabel(x.ym) + " " + num(b[0]) + "원</title></rect>";
      });
      var mo = +x.ym.slice(5, 7);
      var lab = bw < 40 ? String(mo) : (mo === 1 || i === 0 ? x.ym.slice(2, 4) + "." + mo : mo + "월");   // 폰: 숫자만
      s += '<text x="' + (x0 + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="' + (cur ? "#1F2430" : "#8A90A2") + '"' + (cur ? ' font-weight="700"' : "") + ">" + lab + "</text>";
    });
    s += "</svg>";
    var dot = function (c, t) { return '<span><i style="display:inline-block;width:10px;height:10px;background:' + c + ';border-radius:2px;margin-right:4px"></i>' + t + "</span>"; };
    var legend = '<div class="tr-legend">' + dot("#1baf7a", "수입") + dot("#e34948", "지출") + dot("#2a78d6", "저축/투자") + "</div>";
    // 12개월 평균
    var avg = function (key) { var n = ms.filter(function (x) { return x.i || x.e || x.s; }).length || 1; return ms.reduce(function (t, x) { return t + x[key]; }, 0) / n; };
    var tiles = '<div class="tiles tr-tiles">' + tile("월평균 수입", won(avg("i")), "var(--green)") + tile("월평균 지출", won(avg("e")), "var(--red)") + tile("월평균 저축", won(avg("s")), "var(--blue)") + "</div>";
    // 지난달 대비 많이 늘어난 지출 분류 3개
    var prev = shiftYm(ym, -1), catSum = function (c, m) { return sumBy(function (x) { return x.cat === c && x.type === "지출" && x.date.slice(0, 7) === m; }); };
    var ups = D.cats.filter(function (c) { return c.group === "지출"; }).map(function (c) { return { name: c.name, now: catSum(c.name, ym), before: catSum(c.name, prev) }; })
      .filter(function (c) { return c.now - c.before > 0; }).sort(function (p, q) { return (q.now - q.before) - (p.now - p.before); }).slice(0, 3);
    var upHtml = '<div class="tr-up"><b>' + (+prev.slice(5, 7)) + "월보다 많이 늘어난 지출</b>" +
      (ups.length ? ups.map(function (c) { return '<span class="badge hot">' + esc(c.name) + " +" + num(c.now - c.before) + "</span>"; }).join("") : '<span class="muted">늘어난 분류가 없어요</span>') + "</div>";
    return '<div class="card tr-card"><h2>월별 추이<span class="sub">최근 12개월 · ' + esc(ymLabel(ym)) + "까지</span></h2>" + s + legend + tiles + upHtml + "</div>";
  }

  function fitCalSum() { fitNums("#calWrap .cal-sum .v, #calWrap .cal-cell .num, #calWrap .tr-tiles .v"); }
  // 숫자가 칸보다 길면 글자를 조금씩 줄여서 한 줄에 다 보이게
  function fitNums(sel, again) {
    // 글꼴(나눔고딕)이 늦게 받아지면 글자 폭이 바뀌므로 받아진 뒤 한 번 더
    if (!again && document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(function () { fitNums(sel, true); });
    document.querySelectorAll(sel).forEach(function (el) {
      el.style.fontSize = "";
      if (!el.clientWidth) return;
      var fs = parseFloat(getComputedStyle(el).fontSize);
      // 칸 폭과 글자 원래 폭을 같은 단위로 재서 비교 (PC 확대(zoom)·1px 반올림에도 '…'이 남지 않게)
      var box = el.clientWidth;
      var need = function () { el.style.width = "max-content"; var w = el.offsetWidth; el.style.width = ""; return w; };
      while (need() >= box && fs > 7) { fs -= 0.5; el.style.fontSize = fs + "px"; }
    });
  }

  function showView(name) {
    if (name === "home" && D) setTimeout(renderHome, 0);
    document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x.dataset.view === name); });
    document.querySelectorAll(".view").forEach(function (v) { v.classList.toggle("on", v.id === "view-" + name); });
    if (name === "cal" && D) fitCalSum();
    window.scrollTo(0, 0);
  }

  function renderList() {
    var rows = D.ledger.filter(function (x) { return x.date.slice(0, 7) === ym && (listFilter === "전체" || x.type === listFilter); })
      .sort(function (p, q) { return p.date < q.date ? 1 : p.date > q.date ? -1 : q.row - p.row; });
    var chips = ["전체", "지출", "수입", "저축/투자", "이체"].map(function (c) { return '<button class="chip' + (c === listFilter ? " on" : "") + '" data-filter="' + c + '">' + c + "</button>"; }).join("");
    var h = '<h2>' + esc(ymLabel(ym)) + ' 내역<span class="sub">' + rows.length + "건</span></h2><div class=\"chips\">" + chips + "</div>";
    if (!rows.length) h += '<div class="empty">이 달에 내역이 없어요.</div>';
    var lastDay = "";
    rows.forEach(function (x) {
      if (x.date !== lastDay) { lastDay = x.date; var d = new Date(x.date + "T00:00:00"); h += '<div class="day">' + (+x.date.slice(5, 7)) + "월 " + (+x.date.slice(8)) + "일 (" + "일월화수목금토"[d.getDay()] + ")</div>"; }
      h += txLine(x);

  }

  function renderForm() {
    var who = (editing && editing.who) || store("who") || D.members[0] || "";
    var cats = D.cats.filter(function (c) { return c.group === form.group; });

    var items = D.items.filter(function (i) { return i.cat === form.cat; });
    var payDefault = (editing && editing.pay) || store("pay_" + who) || D.pays[0] || "";
    var pays = D.pays.slice(); if (payDefault && pays.indexOf(payDefault) < 0) pays.unshift(payDefault);
    var groups = ["지출", "수입", "저축/투자", "이체"].filter(function (g) { return D.cats.some(function (c) { return c.group === g; }); });
    var h = (editing ? '<h2>내역 수정<span class="sub">' + esc(editing.date) + ' · 원래 줄을 고쳐요</span></h2>' : '<h2>간편 입력<span class="sub">내역입력 탭에 바로 저장돼요</span></h2>') +
      '<div class="field"><label>날짜</label><input class="input" type="date" id="fDate" value="' + esc($("fDate") ? $("fDate").value : D.today) + '"></div>' +
      '<div class="field"><label>누가</label><div class="seg" id="fWho">' + D.members.map(function (m) { return '<button type="button" data-v="' + esc(m) + '" class="' + (m === who ? "on" : "") + '">' + esc(m) + "</button>"; }).join("") + "</div></div>" +
      '<div class="field"><label>구분</label><div class="seg" id="fGroup">' + groups.map(function (g) { return '<button type="button" data-v="' + g + '" class="' + (g === form.group ? "on" : "") + '">' + g + "</button>"; }).join("") + "</div></div>" +
      '<div class="field"><label>대분류</label><div class="catgrid" id="fCat">' + cats.map(function (c) { return '<button type="button" data-v="' + esc(c.name) + '" class="' + (c.name === form.cat ? "on" : "") + '">' + esc(c.name) + "</button>"; }).join("") + "</div>" +
      (form.group === "이체" ? '<div class="hint">카드값이 통장에서 빠져나갔다면 "카드대금", 내용에 카드 이름을 적어 주세요. 지출로 두 번 잡히지 않아요.</div>' : "") + "</div>" +
      (items.length ? '<div class="field"><label>항목 (선택)</label><div class="chips" id="fItem">' + items.map(function (i) { return '<button type="button" class="chip' + (i.name === form.item ? " on" : "") + '" data-v="' + esc(i.name) + '">' + esc(i.name) + "</button>"; }).join("") + "</div></div>" : "") +
      '<div class="field"><label>금액</label><div class="amount-wrap"><input class="input num" id="fAmt" inputmode="decimal" placeholder="0" autocomplete="off">' +
      '<div class="seg cur" id="fCur"><button type="button" data-v="KRW" class="' + (form.currency === "KRW" ? "on" : "") + '">원</button><button type="button" data-v="USD" class="' + (form.currency === "USD" ? "on" : "") + '">$</button></div></div>' +
      '<div class="hint" id="fAmtHint"></div></div>' +
      '<div class="field"><label>내용</label><input class="input" id="fDesc" placeholder="' + (form.cat === "금융소득" ? "예: SCHD 배당 (티커를 넣으면 종목별로 모여요)" : form.cat === "카드대금" ? "예: 생활비 카드" : "예: 마트 장보기") + '" autocomplete="off"></div>' +
      '<div class="field"><label>결제수단</label><select class="input" id="fPay">' + pays.map(function (p) { return '<option' + (p === payDefault ? " selected" : "") + ">" + esc(p) + "</option>"; }).join("") + "</select></div>" +

    var keep = { amt: $("fAmt") ? $("fAmt").value : "", desc: $("fDesc") ? $("fDesc").value : "", memo: $("fMemo") ? $("fMemo").value : "" };

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;

    if (b.dataset.day) { selDay = b.dataset.day; renderCal(); return; }
    if (b.dataset.goAdd) { $("fDate").value = b.dataset.goAdd; showView("add"); return; }
    if (b.id === "prevM" || b.id === "nextM") { ym = shiftYm(ym, b.id === "prevM" ? -1 : 1); render(); return; }
    if (b.id === "refresh") { $("loading").classList.remove("hide"); load("새로 불러왔어요"); return; }
    if (b.dataset.filter) { listFilter = b.dataset.filter; renderList(); return; }

      b.textContent = "지우는 중…";

      return;

    var p = b.parentElement && b.parentElement.id;
    if (p === "fWho") { b.parentElement.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
