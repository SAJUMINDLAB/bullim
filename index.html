<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>불림</title>
<meta name="apple-mobile-web-app-title" content="불림">
<meta name="application-name" content="불림">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root {
    --navy: #3B4256; --ink: #1F2430; --muted: #8A90A2; --line: #E6E8EE; --soft: #F4F5F8; --page: #EEF0F4;
    --blue: #2a78d6; --orange: #eb6834; --green: #1baf7a; --red: #e34948; --gray: #B8BDC9; --mint: #6EE7C5;
    --yellow: #FFF2CC; --card: #FFFFFF; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink);
    font-family: "Nanum Gothic", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  .top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.3px; white-space: nowrap; }
  .brand { display: flex; align-items: center; }
  .brand .logo { width: 24px; height: 24px; margin-right: 7px; }
  .brand small { color: var(--mint); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .month { margin-left: auto; display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.1);
    border-radius: 999px; padding: 2px; }
  .month button { background: none; border: 0; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; }
  .month button:hover { background: rgba(255,255,255,.15); }
  .month span { font-weight: 700; font-size: 14px; min-width: 92px; text-align: center; }
  .icon-btn { background: none; border: 0; color: #fff; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
  .icon-btn:hover { background: rgba(255,255,255,.15); }

  /* nav */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { background: none; border: 0; padding: 8px 0 7px; color: var(--muted); font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button.on { color: var(--navy); }
  .tabs button.add-btn span.dot { width: 40px; height: 40px; margin-top: -14px; border-radius: 50%; background: var(--blue); color: #fff;
    display: grid; place-items: center; box-shadow: 0 4px 12px rgba(42,120,214,.35); }
  .tabs button.add-btn.on span.dot { background: var(--navy); }

  main { max-width: 1240px; margin: 0 auto; padding: 14px 14px calc(86px + env(safe-area-inset-bottom)); }
  .view { display: none; }
  .view.on { display: block; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }

  /* cards */
  .card { background: var(--card); border-radius: var(--radius); padding: 16px 16px 14px; box-shadow: 0 1px 2px rgba(31,36,48,.05); min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--blue); }
  .card h2 .sub { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; }
  .hero { background: linear-gradient(135deg, #3B4256, #2E3446); color: #fff; }
  .hero .label { color: #C9CEDA; font-size: 13px; }
  .hero .big { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 6px 0 10px; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #C9CEDA; }
  .hero .meta b { color: #fff; }
  .delta-up { color: #FF8A8A; font-weight: 700; }
  .delta-down { color: #8CB8F5; font-weight: 700; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--soft); border-radius: 10px; padding: 10px 12px; border-top: 3px solid var(--gray); min-width: 0; }
  .tile .t { color: var(--muted); font-size: 11.5px; display: flex; justify-content: space-between; gap: 6px; }
  .tile .v { font-size: 18px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--red); } .down { color: var(--blue); }
  .muted { color: var(--muted); }

  .meter { height: 10px; border-radius: 6px; background: #ECEEF2; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 6px; background: var(--blue); }
  .meter.over > i { background: var(--red); }
  .row { display: grid; grid-template-columns: minmax(70px, 1.1fr) 1.6fr auto; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .row .amt { text-align: right; white-space: nowrap; font-weight: 700; }
  .row .amt small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .list-line { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list-line:last-child { border-bottom: 0; }
  .list-line .grow { flex: 1; min-width: 0; }
  .list-line .grow .s { color: var(--muted); font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 999px; background: var(--soft); color: var(--navy); white-space: nowrap; }
  .badge.hot { background: #FDEEF1; color: var(--red); }
  /* 고정 수입·지출·카드 결제 일정 */
  .c-card .tiles { margin-bottom: 6px; }
  .c-card .tile .left { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .fx-net { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 2px 2px 6px; border-bottom: 1px solid var(--line); }
  .fx-net b { color: var(--navy); }
  .sched .list-line .d { flex: 0 0 38px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .sched .list-line.done { opacity: .5; }
  .sched .list-line b.num { white-space: nowrap; }
  .split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 10px; gap: 2px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  svg.chart { width: 100%; height: auto; display: block; }

  /* list view */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .day { font-size: 12px; font-weight: 800; color: var(--muted); margin: 14px 0 2px; }
  /* 내역 탭: 검색 + 이번 달 돌아보기 (폰은 위 버튼으로 바꿔 보기, PC는 나란히) */
  .list-seg { margin-bottom: 12px; }
  .list-wrap { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
  .list-wrap.m-list #reviewCard, .list-wrap.m-list #aiCard, .list-wrap.m-review #listCard, .list-wrap.m-review #aiCard, .list-wrap.m-ai #listCard, .list-wrap.m-ai #reviewCard { display: none; }
  .search { position: relative; margin-bottom: 10px; }
  .search .input { padding: 11px 38px 11px 38px; font-size: 15px; background: var(--soft); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search .x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 18px; padding: 6px 8px; display: none; }
  .search.has .x { display: block; }
  .q-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 9px 12px; margin-bottom: 4px; }
  .q-sum b { color: var(--ink); }
  .rv-head { font-size: 14px; font-weight: 700; line-height: 1.5; background: #F0F5FD; color: var(--navy); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .rv-sec { margin-top: 14px; }
  .rv-sec > b { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
  .rv-sec .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .rv-sec .badges .muted { font-size: 13px; }
  .rv-memo { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rv-memo:last-child { border-bottom: 0; }
  .rv-memo .who { flex: 0 0 44px; font-weight: 800; font-size: 13px; padding-top: 10px; }
  .rv-memo textarea { flex: 1; min-width: 0; width: 100%; resize: none; overflow: hidden; min-height: 42px; font-size: 14px; padding: 9px 10px; }
  .rv-memo button { flex: 0 0 auto; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 800; padding: 11px 12px; font-size: 13px; }
  .rv-memo button:disabled { background: var(--gray); }
  .rv-memo .when { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tx .amt { font-weight: 800; white-space: nowrap; }
  .t-수입 { color: var(--green); } .t-지출 { color: var(--red); } .t-저축\/투자 { color: var(--blue); } .t-이체 { color: var(--muted); }
  .del { border: 0; background: none; color: #C4C8D2; font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .del:hover { background: var(--soft); color: var(--red); }
  .del.arm { color: #fff; background: var(--red); }
  .edit { border: 0; background: none; color: #9AA0B0; font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .edit:hover { background: var(--soft); color: var(--blue); }
  .tx .btns { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .form-actions .save { flex: 1; margin-top: 0; }
  .form-actions .cancel { flex: 0 0 96px; border: 1px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; color: var(--muted); }

  /* add form */
  .form { max-width: 560px; margin: 0 auto; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  .input { width: 100%; border: 1px solid var(--line); background: var(--yellow); border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit; color: var(--ink); }
  .input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .amount-wrap { display: flex; gap: 8px; }
  .amount-wrap .input { font-size: 22px; font-weight: 800; text-align: right; }
  .seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px 6px; border-radius: 8px; font-weight: 800; font-size: 14px; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .cur { flex: 0 0 auto; width: 104px; }
  .catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .catgrid button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 11px 6px; font-weight: 700; font-size: 13px; color: var(--ink); }
  .catgrid button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .save { width: 100%; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 800; padding: 15px; margin-top: 4px; }
  .save:disabled { background: var(--gray); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--page); z-index: 40; color: var(--muted); font-weight: 700; }
  #loading.hide { display: none; }
  #signin { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 24px;
    background: #ffffff; color: #191f28; text-align: center; }
  #signin.show { display: grid; }
  .si-box { width: 100%; max-width: 340px; }
  .si-box img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 14px 36px rgba(201,138,16,.22), 0 2px 6px rgba(0,0,0,.05); }
  .si-box h1 { margin: 20px 0 4px; font-size: 30px; letter-spacing: -0.5px; }
  .si-sub { color: #8b95a1; margin: 0 0 34px; font-size: 14px; }
  .si-box .save { background: #1f2b4d; color: #fff; border-radius: 14px; }
  .si-msg { color: #f04452; font-size: 13px; min-height: 18px; margin: 12px 0 0; }
  .si-link { background: none; border: 0; color: #8b95a1; text-decoration: underline; font-size: 13px; margin-top: 6px; }
  .si-note { color: #b0b8c1; font-size: 12px; margin-top: 18px; }

  /* who (가계 카드 안) */
  .who { margin-top: 12px; }
  .who-lab { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; align-items: center; }
  .who-lab i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .who .split { margin-top: 8px; height: 10px; }

  /* hero side stats */
  .hero-side { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .hero-side > div { background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .hero-side .t { font-size: 11px; color: #C9CEDA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-side .v { font-size: 14px; font-weight: 800; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-side .v small { font-size: 11px; font-weight: 700; margin-left: 4px; }

  /* calendar */
  .cal-wrap { display: grid; gap: 14px; grid-template-columns: 1fr; }
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-head div { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0 6px; }
  .cal-head div:first-child { color: var(--red); } .cal-head div:last-child { color: var(--blue); }
  .cal-grid { gap: 3px; }
  .cal-cell { background: var(--soft); border: 0; border-radius: 8px; min-height: 60px; padding: 5px 4px; text-align: left;
    display: flex; flex-direction: column; gap: 1px; color: var(--ink); min-width: 0; overflow: hidden; }
  .cal-cell .d { font-size: 12px; font-weight: 800; margin-bottom: 2px; }
  .cal-cell .i, .cal-cell .e, .cal-cell .s { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-cell .i { color: var(--green); } .cal-cell .e { color: var(--red); } .cal-cell .s { color: var(--blue); }
  .cal-cell.out { visibility: hidden; }
  .cal-cell.sun .d { color: var(--red); } .cal-cell.sat .d { color: var(--blue); }
  .cal-cell.today { background: #EAF8F2; }
  .cal-cell.sel { box-shadow: inset 0 0 0 2px var(--navy); background: #fff; }
  .cal-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
  /* 폰: 달력 아래 수입·지출·남은 돈 (1,000만원 넘어도 안 잘리게) */
  @media (max-width: 759px) {
    .cal-sum { gap: 6px; }
    .cal-sum .tile { padding: 8px 7px; }
    .cal-sum .tile .v { font-size: clamp(12px, 3.9vw, 18px); text-overflow: clip; letter-spacing: -0.3px; }
  }
  /* 월별 추이 (달력 탭 아래, PC에선 두 칸 다 차지) */
  .tr-card { grid-column: 1 / -1; }
  .tr-legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .tr-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; }
  .tr-up { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 12.5px; }
  .tr-up b { margin-right: 4px; }
  .c-acc .hint { margin-top: 8px; }
  .go-add { width: 100%; border: 1px dashed var(--gray); background: #fff; color: var(--navy); font-weight: 800; border-radius: 10px; padding: 11px; margin-top: 10px; }

  @media (max-width: 440px) {
    .brand small { display: none; }
    .month span { min-width: 84px; font-size: 13px; }
    .hero .big { font-size: 30px; }
  }
  /* 아주 좁은 화면 (구글 사이트 안에 넣었을 때 등): 숫자가 잘리지 않게 */
  @media (max-width: 380px) {
    main { padding-left: 8px; padding-right: 8px; }
    .top { padding-left: 10px; padding-right: 8px; gap: 6px; }
    .brand { font-size: 15px; }
    .month span { min-width: 74px; font-size: 12px; }
    .month button { width: 26px; height: 26px; }
    .card { padding: 12px 11px 10px; }
    .hero .big { font-size: clamp(22px, 8.2vw, 30px); }
    .hero .meta { font-size: 11.5px; gap: 2px 10px; }
    .hero-side { gap: 5px; }
    .hero-side > div { padding: 6px 6px; }
    .hero-side .t { font-size: 10px; }
    .hero-side .v { font-size: clamp(11px, 3.9vw, 14px); }
    .tiles { gap: 6px; }
    .tile { padding: 8px 8px; }
    .tile .t { font-size: 10.5px; }
    .tile .v { font-size: clamp(13px, 4.6vw, 18px); }
    .row { grid-template-columns: minmax(58px, 1fr) 1.2fr auto; gap: 6px; font-size: 12px; }
    .list-line { font-size: 12px; gap: 6px; }
    .card h2 .sub { font-size: 10px; }
  }
  /* desktop */
  @media (min-width: 760px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .wide { grid-column: 1 / -1; }
    .tiles.four { grid-template-columns: repeat(4, 1fr); }
    /* 홈: 카드 높이가 달라도 빈칸 없이 위로 채우기 */
    #homeGrid { display: block; column-count: 2; column-gap: 14px; }
    #homeGrid > .card { break-inside: avoid; margin-bottom: 14px; }
    #homeGrid > .hero { column-span: all; }
  }
  @media (min-width: 1000px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .span2 { grid-column: span 2; }
    .tabs { position: sticky; top: 54px; bottom: auto; display: flex; justify-content: center; gap: 4px; padding: 6px; border-top: 0; border-bottom: 1px solid var(--line); }
    .tabs button { flex-direction: row; font-size: 14px; padding: 8px 16px; border-radius: 8px; gap: 6px; }
    .tabs button svg { width: 18px; height: 18px; }
    .tabs button.on { background: var(--soft); }
    .tabs button.add-btn span.dot { width: 22px; height: 22px; margin: 0; box-shadow: none; }
    main { padding-bottom: 30px; }
    #toast { bottom: 30px; }
    .hero .big { font-size: 42px; }
  }
  /* PC: 크게, 시원하게 */
  @media (min-width: 1000px) {
    .list-seg { display: none; }
    .list-wrap { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
    .list-wrap > .card { display: block !important; }
    .list-wrap #listCard { grid-row: span 2; }
    .list-wrap #aiCard { grid-column: 2; }
    main { max-width: 1880px; padding: 24px 28px 40px; }
    .grid { gap: 20px; }
    /* 홈 = 한 화면 대시보드 (3칸) */
    #homeGrid { display: grid; column-count: auto; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-areas: "hero hero hero" "month month card" "budget budget div" "trend goal goal"; }
    #homeGrid > .card { margin: 0; }

    return '<div class="card tr-card"><h2>월별 추이<span class="sub">최근 12개월 · ' + esc(ymLabel(ym)) + "까지</span></h2>" + s + legend + tiles + upHtml + "</div>";

    for (var k in data) body[k] = data[k];
    return fetch(D.photoUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error === "NO_ACCESS") throw new Error("사진 보관에 들어갈 수 없어요. 다시 로그인해 주세요.");
        if (j.error) throw new Error(j.error);
        return j;
      });
  }
  function phLoad(id) {
    if (phCache[id]) return Promise.resolve(phCache[id]);
    if (!phWait[id]) phWait[id] = phCall("get", { id: id }).then(function (j) { phCache[id] = "data:" + j.mime + ";base64," + j.data; delete phWait[id]; return phCache[id]; })
      .catch(function (e) { delete phWait[id]; throw e; });
    return phWait[id];
  }
  function phResize(img, max, q) {
    var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  }
  function phPrep(file) {   // 큰 사진(1600px)과 작은 사진(360px)을 폰에서 미리 줄여서 올려요
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () { res({ full: phResize(img, 1600, 0.82), thumb: phResize(img, 360, 0.75) }); };
        img.onerror = function () { rej(new Error("이 사진은 열 수 없어요. JPG나 PNG로 올려 주세요.")); };
        img.src = fr.result;
      };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }
  function phTxAmt(x) { return x.usd !== "" && x.usd ? x.usd : (x.krw !== "" ? x.krw : x.amt); }
  function photosOf(x) {
    if (!D.photos || !x) return [];
    return D.photos.filter(function (p) {
      if (p.desc === "" && p.amount === "") return false;   // 날짜만 있는 추억 사진은 내역에 붙지 않음
      return p.date === x.date && p.desc === (x.desc || "") && (p.amount === "" || Number(p.amount) === Number(phTxAmt(x)));
    });
  }
  function photosOn(date) { return (D.photos || []).filter(function (p) { return p.date === date; }); }
  function phThumbs(list) {
    return list.map(function (p) { return '<button type="button" class="ph-th" data-ph="' + esc(p.id) + '"><img data-ph-src="' + esc(p.thumb || p.id) + '" alt=""></button>'; }).join("");
  }
  function phHydrate(root) {   // 화면에 나온 작은 사진만 그때그때 불러오기
    if (!root) return;
    [].forEach.call(root.querySelectorAll("img[data-ph-src]"), function (img) {
      var id = img.getAttribute("data-ph-src"); img.removeAttribute("data-ph-src");
      phLoad(id).then(function (u) { img.src = u; }).catch(function () { img.alt = "!"; });
    });
  }
  function phUploadAll(meta, list) {
    var n = list.length, i = 0;
    function next() {
      if (i >= n) return Promise.resolve();
      toast("사진 올리는 중 " + (i + 1) + "/" + n + "…");
      var p = list[i++];
      return phCall("upload", { date: meta.date, who: meta.who || "", desc: meta.desc || "", amount: meta.amount === "" ? "" : meta.amount,
        caption: meta.caption || "", full: p.full.split(",")[1], thumb: p.thumb.split(",")[1] }).then(next);
    }
    return next();
  }
  function phRefresh(msg) { call("getData", [], function (d) { D = d; render(); if (msg) toast(msg); }); }
  function phFormHtml() {
    if (!phReady()) return "";
    var ex = editing && editing.row ? photosOf(D.ledger.filter(function (r) { return r.row === editing.row; })[0]) : [];
    return '<div class="field"><label>사진 (선택)</label><div class="ph-row">' + phThumbs(ex) +
      (form.photos || []).map(function (p, i) { return '<span class="ph-th new"><img src="' + p.thumb + '" alt=""><button type="button" class="x" data-ph-rm="' + i + '" aria-label="빼기">×</button></span>'; }).join("") +
      '<label class="ph-add" title="사진 붙이기">' + svgIcon("카메라", 22) + '<input type="file" id="phFile" accept="image/*" multiple hidden></label></div>' +
      '<div class="hint">영수증 증빙이나 그날의 사진을 붙여 둘 수 있어요. 저장할 때 같이 올라가요.</div></div>';
  }
  function phDayHtml(date) {
    if (!phReady()) return "";
    var list = photosOn(date);
    return '<div class="ph-day"><b>이날의 사진' + (list.length ? " " + list.length + "장" : "") + '</b><div class="ph-row">' + phThumbs(list) +
      '<label class="ph-add" title="사진 추가">' + svgIcon("카메라", 22) + '<input type="file" id="phDayFile" accept="image/*" multiple hidden></label></div></div>';
  }
  function phView() {
    var v = $("phView");
    if (!v) {
      v = document.createElement("div"); v.id = "phView"; v.className = "ph-view";
      v.innerHTML = '<div class="ph-top"><span id="phInfo"></span><button type="button" id="phClose" aria-label="닫기">×</button></div>' +
        '<div class="ph-img"><img id="phImg" alt=""><div id="phLoading">불러오는 중…</div></div>' +
        '<div class="ph-bot"><button type="button" id="phPrev" aria-label="이전">‹</button><span id="phCount"></span><button type="button" id="phNext" aria-label="다음">›</button>' +
        '<button type="button" id="phDel">삭제</button></div>';
      document.body.appendChild(v);
    }
    return v;
  }
  function phOpen(list, i) {
    if (!list.length) return;
    phState = { list: list, i: Math.max(0, Math.min(i || 0, list.length - 1)) };
    phView().classList.add("on"); phShow();
  }
  function phShow() {
    var p = phState.list[phState.i], img = $("phImg");
    $("phInfo").textContent = [p.date, p.desc || p.caption, p.who].filter(Boolean).join(" · ");
    $("phCount").textContent = phState.list.length > 1 ? (phState.i + 1) + " / " + phState.list.length : "";
    $("phPrev").style.visibility = $("phNext").style.visibility = phState.list.length > 1 ? "visible" : "hidden";
    $("phDel").classList.remove("arm"); $("phDel").textContent = "삭제";
    img.removeAttribute("src"); $("phLoading").style.display = "";
    if (p.thumb && phCache[p.thumb]) img.src = phCache[p.thumb];   // 작은 사진 먼저 보여 주고 큰 사진으로 바꿈
    phLoad(p.id).then(function (u) { if (phState.list[phState.i] === p) { img.src = u; $("phLoading").style.display = "none"; } })
      .catch(function (e) { $("phLoading").textContent = e.message || "사진을 불러오지 못했어요"; });
  }
  function phClose() { var v = $("phView"); if (v) v.classList.remove("on"); }
  function phDelete(b) {
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = "정말 삭제"; return; }
    var p = phState.list[phState.i];
    b.textContent = "지우는 중…";
    phCall("delete", { id: p.id }).then(function () { phClose(); phRefresh("사진을 지웠어요 (드라이브 휴지통)"); })
      .catch(function (e) { toast(e.message || String(e)); b.classList.remove("arm"); b.textContent = "삭제"; });
  }
  function phMark(x) { return phReady() && photosOf(x).length ? '<span class="ph-mark" title="사진 있음">' + svgIcon("카메라", 13) + "</span>" : ""; }
  function phTxBtn(x) { var n = phReady() ? photosOf(x).length : 0; return n ? '<button class="edit" data-ph-tx="' + x.row + '">사진' + (n > 1 ? " " + n : "") + "</button>" : ""; }
  // 내역 저장(추가·수정) 뒤: 수정이면 붙어 있던 사진의 날짜·내용·금액도 같이 바꾸고, 새로 붙인 사진은 올림
  function phAfterSave(t, pend, rows) {
    if (!phReady() || (!pend.length && !(rows && rows.length))) return;
    var meta = { date: t.date, who: t.who, desc: t.desc, amount: t.amount };
    var relink = rows && rows.length ? new Promise(function (res) { call("relinkPhotos", [rows, meta], function (d) { D = d; res(); }); }) : Promise.resolve();
    relink.then(function () { return phUploadAll(meta, pend); })
      .then(function () { if (pend.length) phRefresh("사진 " + pend.length + "장도 올렸어요"); else render(); })
      .catch(function (e) { toast("사진 올리기 실패: " + (e.message || e)); });
  }
  function phAddFiles(files, cb) {
    var arr = [].slice.call(files || []).slice(0, 10);
    Promise.all(arr.map(phPrep)).then(cb).catch(function (e) { toast(e.message || "사진을 열지 못했어요"); });
  }
  // PHOTO-END

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) {
      var t = e.target.closest(".tx");
      if (t) { var was = t.classList.contains("open"); document.querySelectorAll(".tx.open").forEach(function (x) { x.classList.remove("open"); }); if (!was) t.classList.add("open"); }
      return;
    }
    if (b.dataset.view) { if (editing) { editing = null; clearForm(); renderForm(); } showView(b.dataset.view); return; }
    if (b.dataset.day) { selDay = b.dataset.day; renderCal(); return; }
    if (b.dataset.ph) {
      var ids = [].map.call((b.closest(".ph-row") || b.parentNode).querySelectorAll("[data-ph]"), function (y) { return y.dataset.ph; });
      var lst = ids.map(function (id) { return (D.photos || []).filter(function (q) { return q.id === id; })[0]; }).filter(Boolean);
      phOpen(lst, ids.indexOf(b.dataset.ph)); return;
    }
    if (b.dataset.phRm) { form.photos.splice(+b.dataset.phRm, 1); renderForm(); return; }
    if (b.dataset.phTx) { phOpen(photosOf(D.ledger.filter(function (r) { return r.row === +b.dataset.phTx; })[0]), 0); return; }
    if (b.id === "phClose") { phClose(); return; }
    if (b.id === "phPrev" || b.id === "phNext") { var L2 = phState.list.length; phState.i = (phState.i + (b.id === "phNext" ? 1 : -1) + L2) % L2; phShow(); return; }
    if (b.id === "phDel") { phDelete(b); return; }
    if (b.id === "aiToggle") { aiAddS.open = !aiAddS.open; renderAiAdd(); if (aiAddS.open && $("aiText")) $("aiText").focus(); return; }
    if (b.id === "aiGo") { aiFill(); return; }
    if (b.id === "aiPhotoX") { aiAddS.img = null; renderAiAdd(); return; }
    if (b.id === "aiSaveAll") { aiSaveAll(); return; }
    if (b.dataset.aiOne) { var e1 = aiAddS.list[+b.dataset.aiOne]; e1.off = true; aiAddS.msg = "아래 입력칸에서 '" + esc(e1.desc || e1.cat) + "'을(를) 고쳐 저장하세요. 나머지는 위에서 한 번에 저장할 수 있어요."; renderAiAdd(); aiFillForm(e1); return; }
    if (b.id === "aiSend") { aiAsk($("aiQ").value); return; }
    if (b.dataset.aiq) { aiAsk(b.dataset.aiq); return; }
    if (b.id === "aiRvBtn") { aiReview(); return; }
    if (b.dataset.cmp) {   // 수익률 비교: 기본/환율, 기간, 범례 켜고 끄기
      var cs = cmpState[b.dataset.cmp];
      if (b.dataset.cmpMode) cs.mode = b.dataset.cmpMode;
      if (b.dataset.cmpRange) cs.range = b.dataset.cmpRange;
      if (b.dataset.cmpKey) cs.off[b.dataset.cmpKey] = !cs.off[b.dataset.cmpKey];
      $(b.dataset.cmp === "long" ? "cmpLong" : "cmpYtd").innerHTML = cmpCard(b.dataset.cmp);
      fitNums(".cmp-cards b");
      return;
    }
    if (b.dataset.goAdd) { $("fDate").value = b.dataset.goAdd; showView("add"); return; }
    if (b.id === "prevM" || b.id === "nextM") { ym = shiftYm(ym, b.id === "prevM" ? -1 : 1); render(); return; }
    if (b.id === "refresh") { $("loading").classList.remove("hide"); load("새로 불러왔어요"); return; }
    if (b.dataset.filter) { listFilter = b.dataset.filter; renderListBody(); return; }
    if (b.id === "listQx") { listQ = ""; $("listQ").value = ""; renderListBody(); $("listQ").focus(); return; }
    if (b.dataset.rvSave) { saveReview(+b.dataset.rvSave, b); return; }
    if (b.parentElement && b.parentElement.id === "listSeg") { listMode = b.dataset.v; renderList(); window.scrollTo(0, 0); return; }
    if (b.classList.contains("edit")) { startEdit(+b.dataset.row); return; }
    if (b.id === "fCancel") { cancelEdit(); return; }
    if (b.classList.contains("del")) {
      if (!b.classList.contains("arm")) { document.querySelectorAll(".del.arm").forEach(function (x) { x.classList.remove("arm"); x.textContent = "삭제"; }); b.classList.add("arm"); b.textContent = "정말 삭제"; return; }
      b.textContent = "지우는 중…";
      call("deleteTransaction", [+b.dataset.row, b.dataset.date, b.dataset.desc], function (d) { D = d; render(); toast("지웠어요"); });
      return;
    }
    var p = b.parentElement && b.parentElement.id;
    if (p === "fWho") { b.parentElement.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
      var pd = store("pay_" + b.dataset.v); if (pd) $("fPay").value = pd; return; }
    if (b.id === "fSugBtn") { applySug(); return; }
    if (p === "fGroup") { form.manual = true; if (sug) sug.applied = false; form.group = b.dataset.v; form.cat = ""; renderForm(); return; }
    if (p === "fCat") { form.manual = true; if (sug) sug.applied = false; form.cat = b.dataset.v; form.item = ""; if (form.cat === "배당금") {} renderForm(); return; }
    if (p === "fItem") { form.manual = true; if (sug) sug.applied = false; form.item = form.item === b.dataset.v ? "" : b.dataset.v; renderForm(); return; }
    if (p === "fCur") { form.currency = b.dataset.v; renderForm(); return; }
    if (b.id === "fSave") { save(); return; }
  });
  var qT, sugT;
  document.addEventListener("input", function (e) {
    if (e.target.id === "fAmt") amtHint();
    if (e.target.id === "aiText") aiAddS.text = e.target.value;
    if (e.target.id === "fDesc") { clearTimeout(sugT); sugT = setTimeout(sugCompute, 220); }
    if (e.target.closest && e.target.closest(".rv-memo")) growArea(e.target);
    if (e.target.id === "listQ") { clearTimeout(qT); qT = setTimeout(function () { listQ = e.target.value; renderListBody(); }, 150); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "listQ" && e.key === "Enter") e.target.blur();
    if ($("phView") && $("phView").classList.contains("on")) {
      if (e.key === "Escape") phClose();
      if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && phState.list.length > 1) { phState.i = (phState.i + (e.key === "ArrowRight" ? 1 : -1) + phState.list.length) % phState.list.length; phShow(); }
    }
    if (e.target.id === "aiQ" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); aiAsk(e.target.value); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "aiFile" && e.target.files && e.target.files[0]) {
      aiLoadImage(e.target.files[0]).then(function (u) { aiAddS.img = u; aiAddS.msg = "사진을 올렸어요. 'AI로 채우기'를 눌러 주세요."; renderAiAdd(); })
        .catch(function (err) { toast(err.message || "사진을 열지 못했어요"); });
    }
    if (e.target.id === "phFile") { phAddFiles(e.target.files, function (arr) { form.photos = (form.photos || []).concat(arr); renderForm(); }); e.target.value = ""; }
    if (e.target.id === "phDayFile") {
      var day = selDay;
      phAddFiles(e.target.files, function (arr) {
        phUploadAll({ date: day, who: store("who") || D.members[0] || "", desc: "", amount: "" }, arr)
          .then(function () { phRefresh("사진 " + arr.length + "장 올렸어요"); }).catch(function (err) { toast("사진 올리기 실패: " + (err.message || err)); });
      });
      e.target.value = "";
    }
    if (e.target.dataset && e.target.dataset.aiChk != null) { aiAddS.list[+e.target.dataset.aiChk].off = !e.target.checked; renderAiAdd(); }
  });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { fitZoom(); if (D) { renderHome(); renderInvest(); renderCal(); } }, 200); });

  fitZoom();
  start();
})();
</script>
</body>
